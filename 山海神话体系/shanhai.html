<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="manifest" href="./manifest.json">
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service‑worker.js');
}
</script>
<meta charset="UTF-8">
<!-- ==========移动端APP优化META========== -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0F">
<title>山海图谱｜道阁版</title>
<style>
:root{
  --bg-black:#0A0A0F;--bg-card:#F5F5F8;--gold-main:#C9B886;--gold-dark:#8A7A52;
  --gray-light:#AAAAAF;--gray-deep:#222228;--war-line:#482020;
  --glow:0 0 12px rgba(201,184,0,.25);--metal-line:#E8E8FF;--water-line:#3c6792;--danger-red:#c74848;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"思源宋体",SimSun,serif;}
body{background:var(--bg-black);color:var(--bg-card);height:100dvh;overflow:hidden;}
body.modal-open{overflow:hidden;touch-action:none;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:#111;}
::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:3px;}

.header{height:64px;border-bottom:1px solid var(--gold-dark);display:flex;align-items:center;padding:0 12px;gap:8px;flex-wrap:nowrap;overflow-x:auto;}
.title{font-size:18px;color:var(--gold-main);font-weight:bold;white-space:nowrap;}
.search-wrap{flex:1;max-width:420px;display:flex;gap:6px;min-width:120px;}
#globalSearch{flex:1;background:#111;border:1px solid var(--gold-dark);color:var(--bg-card);padding:8px 12px;font-size:14px;outline:none;}
#globalSearch:focus{border-color:var(--gold-main);box-shadow:var(--glow);}
.search-clear-btn{background:#222;border:1px solid #444;color:#aaa;padding:0 10px;cursor:pointer;white-space:nowrap;min-height:36px;}
.search-clear-btn:hover{color:#fff;border-color:var(--gold-main);}
.nav-btn-group{display:flex;gap:6px;flex-wrap:nowrap;white-space:nowrap;}
.nav-btn-group>button{background:transparent;border:1px solid var(--gold-main);color:var(--gold-main);padding:8px 8px;font-size:12px;cursor:pointer;border-radius:4px;transition:.2s;white-space:nowrap;min-height:36px;min-width:36px;}
.nav-btn-group>button:hover:not(:disabled){background:rgba(201,184,0,.1);box-shadow:var(--glow);}

.main-wrap{display:flex;height:calc(100dvh - 64px);overflow:hidden;}
/* 侧边栏 */
.sidebar{width:200px;min-width:200px;flex-shrink:0;border-right:1px solid var(--gold-dark);padding:16px 12px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;transition:0.25s;}
.sidebar-toggle-btn{display:none;position:absolute;z-index:100;top:68px;left:4px;background:var(--gray-deep);border:1px solid var(--gold-main);color:var(--gold-main);padding:6px;}

.human-map-box{flex:1;min-width:0;position:relative;overflow:hidden;border-right:1px solid var(--gold-dark);touch-action:none;}
.transform-wrapper{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:0 0;}
#lineSvgLayer{position:absolute;inset:0;pointer-events:none;z-index:1;width:100%;height:100%;overflow:visible !important;}
svg{width:100%;height:100%;overflow:visible !important;}
svg path{stroke-width:2.2;fill:none;stroke-linecap:round;}
svg path.search-glow{stroke-width:3.2;filter:url(#goldGlow);}
svg path.geo-glow{stroke-width:2.8;filter:url(#goldGlow);}
svg path.geo-fade{opacity:.2;}
#humanCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;cursor:grab;}
#humanCanvas:active{cursor:grabbing;}

.node-item{position:absolute;padding:8px 10px;border:1px solid var(--gold-main);font-size:13px;background:var(--gray-deep);border-radius:6px;color:var(--bg-card);transform:translate(-50%,-50%);cursor:pointer;user-select:none;box-shadow:0 0 6px rgba(201,184,0,.15);white-space:nowrap;z-index:2;transition:.2s;max-width:140px;overflow:hidden;text-overflow:ellipsis;min-height:34px;display:flex;align-items:center;justify-content:center;}
.node-item.selected{background:rgba(201,184,0,.25);box-shadow:var(--glow);transform:translate(-50%,-50%) scale(1.08);z-index:10;}
.node-item.search-hit{background:rgba(201,184,0,.4);transform:translate(-50%,-50%) scale(1.12);z-index:8;}
.node-item.fade-hide{opacity:.3;pointer-events:none;z-index:1;}
.node-item.geo-highlight{background:rgba(201,184,0,.35);transform:translate(-50%,-50%) scale(1.15);z-index:9;}

.right-container{width:360px;min-width:320px;max-width:360px;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto;}
.geo-map-panel{height:50%;padding:16px;overflow-y:auto;border-bottom:1px solid var(--gold-dark);}
.geo-title{font-size:18px;color:var(--gold-main);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.geo-del-small{font-size:12px;padding:2px 6px;border:1px solid var(--danger-red);color:var(--danger-red);background:transparent;cursor:pointer;min-height:28px;}
.geo-clear-filter{font-size:12px;padding:2px 6px;border:1px solid #555;color:#aaa;background:transparent;cursor:pointer;min-height:28px;}
.geo-region-item{padding:12px 12px;margin-bottom:10px;border:1px solid var(--gold-dark);font-size:14px;cursor:pointer;transition:.2s;position:relative;min-height:54px;}
.geo-region-item:hover{border-color:var(--gold-main);background:rgba(201,184,0,.08);}
.geo-region-item.active{border-color:var(--gold-main);box-shadow:var(--glow);}
.geo-region-item h4{color:var(--gold-main);font-size:15px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.geo-god-text{font-size:13px;color:var(--gray-light);line-height:1.5;}
.info-panel{height:50%;padding:16px;overflow-y:auto;}
.info-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--gray-light);font-size:14px;}
.info-name{font-size:22px;color:var(--gold-main);margin-bottom:12px;}
.info-row{margin:10px 0;color:var(--gray-light);line-height:1.6;font-size:14px;}
.info-label{color:var(--gold-main);display:inline-block;width:110px;font-size:14px;}
.link-block{margin-top:14px;padding-top:10px;border-top:1px solid #333;}
.link-title{color:var(--gold-main);font-size:16px;margin-bottom:8px;}
.link-item{padding:6px 0;font-size:14px;}

.tool-title{color:var(--gold-main);font-size:16px;margin-bottom:8px;border-bottom:1px solid #333;padding-bottom:4px;}
.tool-btn{width:100%;padding:12px 8px;background:var(--gray-deep);border:none;font-size:14px;color:var(--bg-card);cursor:pointer;text-align:left;transition:.2s;min-height:44px;}
.tool-btn:hover{border-left:4px solid var(--gold-main);}

.daoge-wrap{position:fixed;top:64px;left:0;width:100%;height:calc(100dvh - 64px);background:var(--bg-black);z-index:99;padding:16px 12px;overflow-y:auto;display:none;}
.daoge-wrap.active{display:block;}
.daoge-header-bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.daoge-tab-btn{padding:10px 10px;border:1px solid var(--gold-dark);background:transparent;color:var(--gray-light);cursor:pointer;min-height:40px;}
.daoge-tab-btn.active{border-color:var(--gold-main);color:var(--gold-main);background:rgba(201,184,0,0.1);}
.daoge-add-btn{padding:10px 10px;border:1px solid #3c9267;color:#6cd3a0;background:transparent;cursor:pointer;min-height:40px;}
.daoge-card{border:1px solid var(--gold-dark);padding:14px;margin-bottom:12px;background:rgba(34,34,40,.6);position:relative;cursor:pointer;}
.daoge-card:hover{border-color:var(--gold-main);}
.daoge-card-ops{position:absolute;top:10px;right:10px;display:flex;gap:6px;}
.daoge-card-ops button{padding:4px 8px;font-size:12px;background:transparent;border:1px solid var(--gold-main);color:var(--gold-main);cursor:pointer;min-height:32px;}
.daoge-card-ops .del{border-color:var(--danger-red);color:var(--danger-red);}
.daoge-card h3{color:var(--gold-main);font-size:16px;margin-bottom:8px;padding-right:80px;}
.daoge-card .cate-tag{font-size:12px;color:#8A7A52;margin-bottom:8px;}
.daoge-card .daoge-content{color:var(--gray-light);line-height:1.7;font-size:14px;white-space:pre-wrap;}
.back-daoge-btn{position:sticky;top:0;float:right;margin:-4px -4px 12px 0;padding:8px 12px;font-size:14px;border:1px solid var(--gold-main);color:var(--gold-main);background:var(--bg-black);cursor:pointer;z-index:100;min-height:40px;}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100;padding:12px;}
.modal-mask.active{display:flex;}
.modal-box{width:min(480px,100%);background:var(--gray-deep);border:1px solid var(--gold-main);padding:16px;max-height:85dvh;overflow-y:auto;border-radius:8px;}
.modal-title{color:var(--gold-main);font-size:18px;margin-bottom:14px;}
.modal-input,.modal-select{width:100%;background:#111;border:1px solid #444;color:#fff;font-size:16px;padding:12px;margin:8px 0 14px;}
.modal-textarea{width:100%;background:#111;border:1px solid #444;color:#fff;font-size:16px;padding:12px;margin:8px 0 14px;min-height:180px;white-space:pre-wrap;}
.modal-btn-group{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;}
.confirm-btn{background:var(--gold-main);color:#000;border:none;padding:10px 16px;font-size:14px;cursor:pointer;min-height:42px;}
.cancel-btn{background:transparent;border:1px solid var(--gray-light);color:#fff;padding:10px 16px;font-size:14px;cursor:pointer;min-height:42px;}
.danger-confirm{background:var(--danger-red);color:#fff;border:none;}
.custom-link-input{width:100%;margin:8px 0;padding:12px;background:#111;border:1px solid #666;color:#eee;display:none;font-size:16px;}
.custom-link-input.show{display:block;}
.export-data-btn{border:1px solid #3c9267;color:#6cd3a0;}
.import-data-btn{border:1px solid #6788c9;color:#94b8ff;}
#importFileInput{display:none;}
.highlight-match{background:#ffdd44;color:#000;padding:0 2px;border-radius:2px;}

/* =========手机响应式媒体查询========== */
@media (max-width: 860px){
    .header{padding:0 8px;}
    .title{font-size:16px;}
    .sidebar{position:absolute;z-index:90;height:calc(100dvh - 64px);left:0;transform:translateX(-100%);background:var(--bg-black);}
    .sidebar.sidebar-open{transform:translateX(0);}
    .sidebar-toggle-btn{display:block;}
    .main-wrap{flex-direction:column;}
    .human-map-box{flex-grow:1;border-right:none;border-bottom:1px solid var(--gold-dark);height:55vh;min-height:240px;}
    .right-container{width:100%;max-width:100%;height:45vh;min-height:220px;}
    .geo-map-panel{height:50%;}
    .info-panel{height:50%;}
    .daoge-wrap{padding:12px 8px;}
    .info-label{width:90px;}
}
</style>
</head>
<body>
<button class="sidebar-toggle-btn" id="sidebarToggleBtn">☰工具</button>
<header class="header">
  <div class="title">山海图谱</div>
  <div class="search-wrap">
    <input id="globalSearch" placeholder="搜索节点 / 道阁典籍">
    <button class="search-clear-btn" id="clearSearchBtn">清空</button>
  </div>
  <div class="nav-btn-group">
    <button id="openDaoGeBtn">道阁</button>
    <button id="saveDataBtn">存档</button>
    <button id="rankColorSetBtn">层级颜色</button>
    <button id="exportDataBtn" class="export-data-btn">导出</button>
    <button id="importDataBtn" class="import-data-btn">导入</button>
    <input type="file" id="importFileInput" accept=".json" />
    <button id="resetCanvasBtn">重置</button>
    <button id="autoArrangeBtn">排布</button>
  </div>
</header>
<div class="main-wrap">
  <aside class="sidebar" id="sidebarDom">
    <div><div class="tool-title">视图操作</div>
      <button class="tool-btn" id="zoomIn">放大 +</button>
      <button class="tool-btn" id="zoomOut">缩小 -</button>
    </div>
    <div><div class="tool-title">图谱编辑</div>
      <button class="tool-btn" id="addNodeBtn">新增节点</button>
      <button class="tool-btn" id="editNodeBtn">编辑节点</button>
      <button class="tool-btn" id="createLinkBtn">创建羁绊</button>
      <button class="tool-btn" id="deleteNodeBtn">删除节点</button>
    </div>
    <div><div class="tool-title">地理管理</div>
      <button class="tool-btn" id="addGeoBtn">新增分区</button>
    </div>
  </aside>
  <section class="human-map-box" id="mapBox">
    <div class="transform-wrapper" id="wrapper">
      <svg id="lineSvgLayer">
        <defs><filter id="goldGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="coloredBlur" /><feMerge><feMergeNode in="coloredBlur" /><feMergeNode in="SourceGraphic" /></feMerge></filter></defs>
      </svg>
      <div id="humanCanvas"></div>
    </div>
  </section>
  <div class="right-container">
    <div class="geo-map-panel">
      <h3 class="geo-title">地理脉络分区 <button class="geo-clear-filter" id="clearGeoFilterBtn">清除筛选</button></h3>
      <div id="geoListBox"></div>
    </div>
    <div class="info-panel" id="infoPanel"><div class="info-empty">点击画布任意节点查看详情</div></div>
  </div>
</div>
<div class="daoge-wrap" id="daoGeWrap">
  <button class="back-daoge-btn" id="closeDaoGeBtn">返回脉络</button>
  <div class="daoge-header-bar">
    <h2 style="color:var(--gold-main);font-size:20px;">道阁</h2>
    <button class="daoge-tab-btn active" data-cate="daojing">道经录入</button>
    <button class="daoge-tab-btn" data-cate="mythbook">神话典籍</button>
    <button class="daoge-add-btn" id="addDaoGeItemBtn">新增典籍</button>
  </div>
  <div id="daoGeCardBox"></div>
</div>
<!-- 新增：道阁只读查看弹窗 -->
<div class="modal-mask" id="daoGeViewModal">
  <div class="modal-box">
    <h3 class="modal-title" id="viewDaoGeTitle"></h3>
    <div style="font-size:12px;color:var(--gray-light);margin-bottom:10px;" id="viewDaoGeCate"></div>
    <div style="white-space:pre-wrap;color:var(--bg-card);line-height:1.7;max-height:60vh;overflow-y:auto;" id="viewDaoGeContent"></div>
    <div class="modal-btn-group" style="margin-top:20px;">
      <button class="cancel-btn" id="closeViewDaoGeBtn">关闭</button>
    </div>
  </div>
</div>
<div class="modal-mask" id="daoGeEditModal">
  <div class="modal-box">
    <h3 class="modal-title" id="daoGeModalTitle">新增典籍</h3>
    <input type="hidden" id="editDaoGeId">
    <select class="modal-select" id="daoGeCateSelect">
      <option value="daojing">道经录入</option>
      <option value="mythbook">神话典籍</option>
    </select>
    <input class="modal-input" id="daoGeTitleInput" placeholder="典籍标题">
    <textarea class="modal-textarea" id="daoGeContentInput" placeholder="录入经文/典籍内容，支持换行"></textarea>
    <div class="modal-btn-group">
      <button class="cancel-btn" id="cancelDaoGeModal">取消</button>
      <button class="confirm-btn" id="saveDaoGeBtn">保存</button>
    </div>
  </div>
</div>
<div class="modal-mask" id="daoGeDelModal">
  <div class="modal-box">
    <h3 class="modal-title">确认删除典籍</h3>
    <p style="color:var(--gray-light);margin:10px 0;">删除后典籍永久丢失，不可恢复！</p>
    <input type="hidden" id="delDaoGeId">
    <div class="modal-btn-group">
      <button class="cancel-btn" id="cancelDelDaoGe">取消</button>
      <button class="confirm-btn danger-confirm" id="confirmDelDaoGe">确认删除</button>
    </div>
  </div>
</div>
<div class="modal-mask" id="delNodeConfirmModal">
  <div class="modal-box">
    <h3 class="modal-title">确认删除节点</h3>
    <p style="color:var(--gray-light);margin:10px 0;">删除同时清除全部关联羁绊，不可恢复！</p>
    <div class="modal-btn-group">
      <button class="cancel-btn" id="cancelDelNode">取消</button>
      <button class="confirm-btn danger-confirm" id="confirmDelNode">确认删除</button>
    </div>
  </div>
</div>
<div class="modal-mask" id="nodeModal">
  <div class="modal-box">
    <h3 class="modal-title" id="nodeModalTitle">新增节点</h3>
    <input type="hidden" id="editTargetId">
    <input class="modal-input" id="nodeNameInput" placeholder="节点名称">
    <input class="modal-input" id="nodeRankInput" placeholder="层级分类">
    <input class="modal-input" id="nodeGeoInput" placeholder="所属地理分区">
    <input class="modal-input" id="nodeEraInput" placeholder="所属纪元">
    <input class="modal-input" id="nodeMythRefInput" placeholder="关联神话典籍（多个用逗号分隔）">
    <textarea class="modal-input" id="nodePowerInput" rows="2" placeholder="核心属性/权能"></textarea>
    <textarea class="modal-input" id="nodeDescInput" rows="4" placeholder="详细描述"></textarea>
    <div class="modal-btn-group">
      <button class="cancel-btn" id="cancelNodeModal">取消</button>
      <button class="confirm-btn" id="saveNodeBtn">确认保存</button>
    </div>
  </div>
</div>
<div class="modal-mask" id="addGeoModal">
  <div class="modal-box">
    <h3 class="modal-title">新增地理分区</h3>
    <input class="modal-input" id="geoNameInput" placeholder="分区名称">
    <textarea class="modal-input" id="geoAreaInput" rows="3" placeholder="包含地域，逗号分隔"></textarea>
    <div class="modal-btn-group">
      <button class="cancel-btn" id="cancelAddGeo">取消</button>
      <button class="confirm-btn" id="confirmAddGeo">确认新增</button>
    </div>
  </div>
</div>
<div class="modal-mask" id="delGeoModal">
  <div class="modal-box">
    <h3 class="modal-title">删除地理分区</h3>
    <p style="color:var(--gray-light);margin:10px 0;">删除后节点清空归属，不可恢复</p>
    <input class="modal-input" id="delGeoCheckInput" placeholder="输入分区名称确认删除">
    <div class="modal-btn-group">
      <button class="cancel-btn" id="cancelDelGeo">取消</button>
      <button class="confirm-btn danger-confirm" id="confirmDelGeo">确认删除</button>
    </div>
  </div>
</div>
<div class="modal-mask" id="linkTypeModal">
  <div class="modal-box">
    <h3 class="modal-title">选择羁绊关系</h3>
    <select class="modal-select" id="linkTypeSelect">
      <option value="同源大道">同源大道｜鎏金</option>
      <option value="君臣佐辅">君臣佐辅｜鎏金</option>
      <option value="常驻道场">常驻属地｜暗金</option>
      <option value="生死敌对">生死敌对｜暗红</option>
      <option value="联合镇守">联合镇守｜鎏金</option>
      <option value="魂魄监管">魂魄监管｜银灰</option>
      <option value="地域同属">同地域共处｜浅蓝</option>
      <option value="custom">自定义羁绊</option>
    </select>
    <input class="custom-link-input" id="customLinkName" placeholder="自定义羁绊名称">
    <input class="custom-link-input" id="customLinkColor" placeholder="连线颜色 #ff8800">
    <div class="modal-btn-group">
      <button class="cancel-btn" id="cancelCreateLink">取消</button>
      <button class="confirm-btn" id="confirmCreateLink">生成连线</button>
    </div>
  </div>
</div>
<div class="modal-mask" id="rankColorModal">
  <div class="modal-box">
    <h3 class="modal-title">层级字体颜色设置</h3>
    <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;">
      <input type="checkbox" id="toggleRankFontColor">
      <label for="toggleRankFontColor">启用层级字体颜色</label>
    </div>
    <div id="rankColorListBox"></div>
    <div>
      <input class="modal-input" id="newRankNameInput" placeholder="新增层级名称">
      <input class="modal-input" type="color" id="newRankColorInput" value="#8866ff">
    </div>
    <div class="modal-btn-group">
      <button class="cancel-btn" id="cancelRankColorBtn">关闭</button>
      <button class="confirm-btn" id="addRankColorBtn">添加层级颜色</button>
    </div>
  </div>
</div>
<script>const CONST={DB_NAME:"ShanHaiGraphDB",DB_STORE:"mainData",MIN_SCALE:0.4,MAX_SCALE:2.5,SCALE_STEP:0.1,SCALE_BIG_STEP:0.15,NODE_GAP_X:320,NODE_GAP_Y:320,AUTO_ARRANGE_MAX_COL:4,SAVE_DELAY:300,OFFSET_LIMIT:3000};
const LINE_COLOR_MAP={"同源大道":"var(--gold-main)","君臣佐辅":"var(--gold-main)","常驻道场":"var(--gold-dark)","生死敌对":"var(--war-line)","联合镇守":"var(--gold-main)","魂魄监管":"var(--metal-line)","地域同属":"var(--water-line)"};

function escapeHtml(str){if(!str)return"";return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function highlightText(text,kw){if(!kw||!text)return escapeHtml(text||"");const k=escapeHtml(kw.trim());return escapeHtml(text||"").replace(new RegExp(`(${k})`,"gi"),"<span class='highlight-match'>$1</span>");}
function safeColor(s){s=(s||"").trim().toLowerCase();return /^(#([0-9a-fA-F]{3,6})|rgb\(|rgba\(|hsl\(|hsla\()/.test(s)?s:"var(--metal-line)";}

async function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(CONST.DB_NAME,1);req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(CONST.DB_STORE))d.createObjectStore(CONST.DB_STORE);};req.onsuccess=e=>{db=e.target.result;resolve(db);};req.onerror=()=>{alert("IndexedDB打开失败");reject();};});}
function dbPut(k,v){return new Promise((res,rej)=>{const tx=db.transaction(CONST.DB_STORE,"readwrite");const st=tx.objectStore(CONST.DB_STORE);st.put(v,k).onsuccess=res;tx.onerror=rej;});}
function dbGet(k){return new Promise((res,rej)=>{const tx=db.transaction(CONST.DB_STORE,"readonly");const st=tx.objectStore(CONST.DB_STORE);const r=st.get(k);r.onsuccess=()=>res(r.result);r.onerror=rej;});}

async function saveData(){
    if(isSaving){
        pendingSave = true;
        return;
    }
    isSaving = true;
    try{
        await dbPut("graphData", globalData);
    }catch(err){
        console.error("保存失败：",err);
        alert("本地存档失败："+err.message);
    }finally{
        isSaving = false;
        if(pendingSave){
            pendingSave = false;
            await saveData();
        }
    }
}

function clampOffset(){globalData.offsetX=Math.max(-CONST.OFFSET_LIMIT,Math.min(CONST.OFFSET_LIMIT,globalData.offsetX));globalData.offsetY=Math.max(-CONST.OFFSET_LIMIT,Math.min(CONST.OFFSET_LIMIT,globalData.offsetY));}
function updateWrapperTransform(){clampOffset();wrapper.style.transform=`translate(${globalData.offsetX}px,${globalData.offsetY}px) scale(${globalData.scale})`;wrapper.style.transformOrigin="0 0";}

function getNodeEdgePoint(node,targetX,targetY){
    const cx=node.x,cy=node.y;
    const cssScale=globalData.selectedNode?.id===node.id?1.08:1.0;
    const safeOutset=18;
    let halfW=(90*cssScale)/2+safeOutset,halfH=(26*cssScale)/2+safeOutset;
    const dom=canvas.querySelector(`.node-item[data-id="${node.id}"]`);
    if(dom){
        const rect=dom.getBoundingClientRect();
        const ds=globalData.scale||1;
        halfW=rect.width/ds/2+safeOutset;
        halfH=rect.height/ds/2+safeOutset;
    }
    const xmin=cx-halfW,xmax=cx+halfW,ymin=cy-halfH,ymax=cy+halfH;
    const dx=targetX-cx,dy=targetY-cy;
    const len=Math.hypot(dx,dy);
    if(len<12)return {x:cx,y:cy};
    let tMin=0;
    const tMax=1;
    if(Math.abs(dx)>1e-6){
        const t1=(xmin-cx)/dx,t2=(xmax-cx)/dx;
        tMin=Math.max(tMin,Math.min(t1,t2));
    }
    if(Math.abs(dy)>1e-6){
        const t1=(ymin-cy)/dy,t2=(ymax-cy)/dy;
        tMin=Math.max(tMin,Math.min(t1,t2));
    }
    tMin=Math.min(tMin,tMax);
    return {x:cx+dx*tMin,y:cy+dy*tMin};
}

async function saveNodeData(){
    const name=$("nodeNameInput").value.trim();
    if(!name)return alert("节点名称不能为空");
    const rank=$("nodeRankInput").value.trim(),geoArea=$("nodeGeoInput").value.trim(),era=$("nodeEraInput").value.trim();
    const mythRef=$("nodeMythRefInput").value.trim();
    const power=$("nodePowerInput").value.trim(),desc=$("nodeDescInput").value.trim();
    const tid=Number(editTargetId.value);
    if(tid>0){
        const n=getNodeById(tid);
        if(!n)return alert("节点已不存在");
        Object.assign(n,{name,rank,geoArea,era,mythRef,power,desc});
        alert("✅修改成功");
    }else{
        const rect=mapBox.getBoundingClientRect();
        const wx=(rect.width/2-globalData.offsetX)/globalData.scale;
        const wy=(rect.height/2-globalData.offsetY)/globalData.scale;
        const maxId=globalData.nodeList.reduce((m,n)=>Math.max(m,n.id),0);
        globalData.nodeList.push({id:maxId+1,name,rank,geoArea,era,mythRef,power,desc,x:wx,y:wy,cls:"normal"});
        alert("✅新增节点");
    }
    nodeModal.classList.remove("active");
    decModalOpen();
    clearNodeForm();
    await saveData();
    renderGeoPanel();
    renderCanvas(searchInput.value);
    renderDaoGeList(searchInput.value);

function renderGeoPanel(){
    geoBox.innerHTML="";
    if(!globalData.geoRegionList.length){geoBox.innerHTML="<div style='color:#aaa'>暂无地理分区</div>";return;}
    globalData.geoRegionList.forEach(r=>{
        const div=document.createElement("div");
        div.className="geo-region-item"+(globalData.activeGeoFilter===r.name?" active":"");
        const match=globalData.nodeList.filter(n=>n.geoArea===r.name);
        const names=match.map(i=>escapeHtml(i.name)).join("、")||"无";
        div.innerHTML=`<h4>${escapeHtml(r.name)}<button class="geo-del-small" data-g="${escapeHtml(r.name)}">删除</button></h4><div class="geo-god-text">地域：${escapeHtml(r.areas)}</div><div class="geo-god-text">节点：${names}</div>`;
        div.onclick=e=>{
            if(e.target.classList.contains("geo-del-small"))return;
            if(!match.length){globalData.geoClickIndex[r.name]=0;return alert("该分区暂无节点");}
            if(globalData.activeGeoFilter!==r.name){
                globalData.activeGeoFilter=r.name;
                if(globalData.selectedNode&&globalData.selectedNode.geoArea!==r.name)globalData.selectedNode=null;
                globalData.geoClickIndex[r.name]=0;
            }else{
                globalData.geoClickIndex[r.name]=(globalData.geoClickIndex[r.name]+1)%match.length;
            }
            const target=match[globalData.geoClickIndex[r.name]];
            const rect=mapBox.getBoundingClientRect();
            globalData.scale=Math.max(1.1,globalData.scale);
            globalData.offsetX=rect.width/2-target.x*globalData.scale;
            globalData.offsetY=rect.height/2-target.y*globalData.scale;
            clampOffset();
            globalData.selectedNode=target;
            updateWrapperTransform();
            saveData();
            renderGeoPanel();
            renderCanvas(searchInput.value);
        };
        div.querySelector(".geo-del-small").onclick=e=>{
            e.stopPropagation();
            globalData.tempDelGeoName=r.name;
            delGeoCheckInput.value="";
            delGeoModal.classList.add("active");
            incModalOpen();
            delGeoCheckInput.focus();
        };
        geoBox.appendChild(div);
    });
}

function renderCanvas(searchText=""){
    updateWrapperTransform();
    canvas.innerHTML="";
    [...lineSvg.children].forEach(c=>{if(c.tagName.toLowerCase()!=="defs")c.remove();});
    if(globalData.isCreatingLink&&globalData.linkStartNode&&!getNodeById(globalData.linkStartNode.id)){abortLinkCreating();alert("⚠️起点已删除，取消羁绊");}
    const sv=searchText.trim().toLowerCase();
    const searchHit=new Set(),geoHit=new Set();
    if(sv) globalData.nodeList.forEach(n=>{if([n.name,n.rank,n.geoArea,n.era,n.mythRef,n.power,n.desc].some(t=>(t||"").toLowerCase().includes(sv)))searchHit.add(n.id);});
    if(globalData.activeGeoFilter) globalData.nodeList.forEach(n=>{if(n.geoArea===globalData.activeGeoFilter)geoHit.add(n.id);});
    const svgNS="http://www.w3.org/2000/svg";
    globalData.linkList.forEach(link=>{
        const s=getNodeById(link.startId),e=getNodeById(link.endId);
        if(!s||!e)return;
        const sp=getNodeEdgePoint(s,e.x,e.y),ep=getNodeEdgePoint(e,s.x,s.y);
        const path=document.createElementNS(svgNS,"path");
        path.setAttribute("d",`M${sp.x} ${sp.y} L${ep.x} ${ep.y}`);
        let stroke;
        stroke=link.isCustom?(link.color||"var(--metal-line)"):(LINE_COLOR_MAP[link.type]||"var(--gold-main)");
        path.setAttribute("stroke",stroke);
        path.setAttribute("fill","none");
        if(searchHit.has(s.id)&&searchHit.has(e.id))path.classList.add("search-glow");
        if(geoHit.has(s.id)&&geoHit.has(e.id))path.classList.add("geo-glow");
        if(globalData.activeGeoFilter&&!(geoHit.has(s.id)&&geoHit.has(e.id)))path.classList.add("geo-fade");
        lineSvg.appendChild(path);
    });
    const frag=document.createDocumentFragment();
    globalData.nodeList.forEach(node=>{
        let cls="node-item";
        if(globalData.selectedNode?.id===node.id)cls+=" selected";
        if(sv&&!searchHit.has(node.id))cls+=" fade-hide";
        if(searchHit.has(node.id))cls+=" search-hit";
        if(globalData.activeGeoFilter&&geoHit.has(node.id))cls+=" geo-highlight";
        const dom=document.createElement("div");
        dom.className=cls;
        dom.textContent=escapeHtml(node.name);
        dom.style.left=node.x+"px";
        dom.style.top=node.y+"px";
        dom.dataset.id=node.id;
        dom.title = escapeHtml(node.name);
        dom.style.color=(globalData.enableRankFontColor&&globalData.rankColorMap[node.rank||""])?globalData.rankColorMap[node.rank]:"";
        dom.onclick=ev=>{ev.stopPropagation();nodeClickHandle(node);};
        dom.ondblclick=()=>{abortLinkCreating();globalData.selectedNode=node;openEditNodeModal(node);};
        frag.appendChild(dom);
    });
    canvas.appendChild(frag);
    refreshInfoPanel(sv);
}

function nodeClickHandle(node){
    if(globalData.isCreatingLink&&globalData.linkStartNode){
        if(node.id===globalData.linkStartNode.id)return alert("不能连接自身");
        const rt=linkSelect.value==="custom"?customLinkInput.value.trim()||"自定义羁绊":linkSelect.value;
        const dup=globalData.linkList.some(l=>{
            const same=(l.startId===globalData.linkStartNode.id&&l.endId===node.id)||(l.endId===globalData.linkStartNode.id&&l.startId===node.id);
            return same&&l.type===rt;
        });
        if(dup)return alert("已存在该羁绊");
        linkTypeModal.dataset.targetId=node.id;
        linkTypeModal.classList.add("active");
        incModalOpen();
        return;
    }
    globalData.selectedNode=node;
    renderCanvas(searchInput.value);
}

$("autoArrangeBtn").onclick=async ()=>{
  if(!confirm("⚠️自动排布将会覆盖所有节点现有位置，是否继续？")) return;
  try{
      const startX=150,startY=120,gx=CONST.NODE_GAP_X,gy=CONST.NODE_GAP_Y,maxCol=CONST.AUTO_ARRANGE_MAX_COL;
      let currY=startY;
      const rankMap={};
      globalData.nodeList.forEach(n=>{const k=(n.rank?.trim()||"未分类");rankMap[k]=rankMap[k]||[];rankMap[k].push(n);});
      Object.values(rankMap).forEach(layer=>{
          let idx=0;
          layer.forEach(node=>{
              const col=idx%maxCol,row=Math.floor(idx/maxCol);
              node.x=startX+col*gx;
              node.y=currY+row*gy;
              idx++;
          });
          currY+=Math.ceil(layer.length/maxCol)*gy;
      });
      globalData.scale=0.7;
      globalData.offsetX=100;
      globalData.offsetY=100;
      globalData.selectedNode=null;
      globalData.isCreatingLink=false;
      globalData.linkStartNode=null;
      await saveData();
      if(globalData.nodeList.length>0){
          const xs=globalData.nodeList.map(p=>p.x),ys=globalData.nodeList.map(p=>p.y);
          const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
          const rect=mapBox.getBoundingClientRect();
          globalData.offsetX=rect.width/2-cx*globalData.scale;
          globalData.offsetY=rect.height/2-cy*globalData.scale;
          clampOffset();
      }
      updateWrapperTransform();
      renderGeoPanel();
      renderCanvas(searchInput.value);
      renderDaoGeList(searchInput.value);
      alert("✅自动排布完成");
  }catch(err){
      console.error(err);
      alert("自动排布出错："+err.message);
  }
};

let dragStartX=0,dragStartY=0,origX=0,origY=0;
canvas.onmousedown=e=>{
    if(e.target!==canvas)return;
    dragStartX=e.clientX;
    dragStartY=e.clientY;
    origX=globalData.offsetX;
    origY=globalData.offsetY;
    async function upEv(){
        document.removeEventListener("mousemove",moveEv);
        document.removeEventListener("mouseup",upEv);
        clearTimeout(dragSaveTimer);
        dragSaveTimer=setTimeout(async ()=>await saveData(),CONST.SAVE_DELAY);
    }
    function moveEv(ev){
        const dx=ev.clientX-dragStartX,dy=ev.clientY-dragStartY;
        globalData.offsetX=origX+dx;
        globalData.offsetY=origY+dy;
        clampOffset();
        updateWrapperTransform();
    }
    document.addEventListener("mousemove",moveEv);
    document.addEventListener("mouseup",upEv);
};

canvas.addEventListener("touchstart",e=>{
    const t=e.touches;
    if(e.target === canvas){
        e.preventDefault();
    }
    if(t.length===1){
        touchState.active=true;
        touchState.lastX=t[0].clientX;
        touchState.lastY=t[0].clientY;
        touchState.origOffsetX=globalData.offsetX;
        touchState.origOffsetY=globalData.offsetY;
    }else if(t.length===2){
        const dx=t[1].clientX-t[0].clientX,dy=t[1].clientY-t[0].clientY;
        touchState.lastDist=Math.hypot(dx,dy);
        touchState.origScale=globalData.scale;
    }
},{passive:false});

canvas.addEventListener("touchmove",e=>{
    if(e.target === canvas){
        e.preventDefault();
    }
    const t=e.touches;
    if(t.length===1&&touchState.active){
        const dx=t[0].clientX-touchState.lastX,dy=t[0].clientY-touchState.lastY;
        globalData.offsetX=touchState.origOffsetX+dx;
        globalData.offsetY=touchState.origOffsetY+dy;
        clampOffset();
        updateWrapperTransform();
    }else if(t.length===2){
        const dx=t[1].clientX-t[0].clientX,dy=t[1].clientY-t[0].clientY;
        const ratio=Math.hypot(dx,dy)/touchState.lastDist;
        globalData.scale=Math.max(CONST.MIN_SCALE,Math.min(CONST.MAX_SCALE,touchState.origScale*ratio));
        updateWrapperTransform();
    }
},{passive:false});

canvas.addEventListener("touchend",async ()=>{
    touchState.active=false;
    clearTimeout(dragSaveTimer);
    dragSaveTimer=setTimeout(async ()=>await saveData(),CONST.SAVE_DELAY);
});

canvas.addEventListener("wheel",async e=>{
    e.preventDefault();
    const rect=mapBox.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    const wx=(mx-globalData.offsetX)/globalData.scale;
    const wy=(my-globalData.offsetY)/globalData.scale;
    const ns=e.deltaY<0
        ? Math.min(globalData.scale+CONST.SCALE_STEP,CONST.MAX_SCALE)
        : Math.max(globalData.scale-CONST.SCALE_STEP,CONST.MIN_SCALE);
    globalData.offsetX=mx-wx*ns;
    globalData.offsetY=my-wy*ns;
    globalData.scale=ns;
    clampOffset();
    updateWrapperTransform();
    renderCanvas(searchInput.value);
    if(wheelTimeout)clearTimeout(wheelTimeout);
    wheelTimeout=setTimeout(async ()=>await saveData(),CONST.SAVE_DELAY);
},{passive:false});
